version: '3.8'

services:
  # Service 1: PostgreSQL + pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: party_db_container
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - party-network

  # Service 2: pgAdmin (UI quản lý DB)
  pgadmin:
    image: dpage/pgadmin4
    container_name: party_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - party-network

  # Service 3: MinIO (Object Storage - S3 compatible)
  minio:
    image: minio/minio
    container_name: party_minio
    restart: always
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL}
      MINIO_LOG_LEVEL: ${MINIO_LOG_LEVEL:-info}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - party-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres_data:
  minio_data:

networks:
  party-network:
    driver: bridge