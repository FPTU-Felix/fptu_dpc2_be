version: '3.8'

services:
  # Service 1: Database PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: party_db_container
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d  
    networks:
      - party-network

  # Service 2: pgAdmin (Quản lý DB qua web)
  pgadmin:
    image: dpage/pgadmin4
    container_name: party_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - party-network

volumes:
  postgres_data:

networks:
  party-network: